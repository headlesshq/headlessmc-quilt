name: Lifecycle

# release-please maintains the release PR (version in gradle.properties, CHANGELOG.md).
# When that PR is merged it creates the GitHub release; the release job then builds the plugin and attaches its jar
# and index-entry.json, the entry for https://github.com/headlesshq/headlessmc-plugins, which is also in the job summary.
"on":
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@a02a34c4d625f9be7cb89156071d8567266a2445 # v4.2.0
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  release:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          java-version: 25
          distribution: temurin
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build generatePluginIndexEntry --stacktrace
      - name: Upload the release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          version=$(sed -n 's/^version=//p' gradle.properties)
          cp build/headlessmc-plugin/index-entry.json index-entry.json
          gh release upload "$TAG" "build/libs/headlessmc-quilt-$version.jar" index-entry.json --clobber
      - name: Plugin index entry
        run: |
          {
            echo 'Add this entry to `plugins` in `index.json` of [headlessmc-plugins](https://github.com/headlesshq/headlessmc-plugins),'
            echo 'or append its `downloads` to the existing `quilt` entry:'
            echo
            echo '```json'
            cat index-entry.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
